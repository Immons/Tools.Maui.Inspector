name: Mirror docs to the wiki

# docs/ is the source of truth — versioned with the code, reviewed with it, and shipped with the
# tags. The wiki is a read-only copy of it, so the sidebar and the search are there for people who
# just want to read. Anything edited in the wiki directly is overwritten by the next run.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clone the wiki
        run: |
          if ! git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki; then
            echo "::error::The wiki repository does not exist yet. GitHub only creates it after the first page is saved by hand — open the repo's Wiki tab, press 'Create the first page', save anything, then re-run this workflow."
            exit 1
          fi

      - name: Copy the pages, rewriting the links for the wiki
        run: |
          python3 - <<'PY'
          import pathlib, re, shutil

          repo = "${{ github.repository }}"
          raw = f"https://raw.githubusercontent.com/{repo}/main/docs"
          src, dst = pathlib.Path("docs"), pathlib.Path("wiki")

          # Wiki pages are addressed without the .md, and images cannot be relative there.
          pages = {p.stem for p in src.glob("*.md")}

          for page in sorted(src.glob("*.md")):
              text = page.read_text()
              text = re.sub(r"\]\((" + "|".join(map(re.escape, pages)) + r")\.md(#[\w-]*)?\)",
                            lambda m: f"]({m.group(1)}{m.group(2) or ''})", text)
              text = re.sub(r"\]\(([\w.-]+\.(?:png|jpg|jpeg|gif|svg))\)", rf"]({raw}/\1)", text)
              # docs/README.md is the index; the wiki calls its index Home.
              name = "Home.md" if page.name == "README.md" else page.name
              (dst / name).write_text(text)
              print("->", name)

          for image in src.iterdir():
              if image.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".svg"}:
                  shutil.copy2(image, dst / image.name)

          # A page renamed or dropped in docs/ has to disappear from the wiki too, or it lingers
          # there forever — unreachable from the sidebar but still served by search and old links.
          keep = {("Home.md" if p.name == "README.md" else p.name) for p in src.glob("*.md")}
          keep |= {p.name for p in src.iterdir() if p.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".svg"}}
          for stale in dst.iterdir():
              if stale.name != ".git" and stale.name not in keep:
                  stale.unlink()
                  print("removed", stale.name)
          PY

      - name: Push, if anything changed
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
            exit 0
          fi
          git commit -m "Mirror docs from ${GITHUB_SHA::7}"
          git push
