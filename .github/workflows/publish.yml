name: Pack & publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the packages to nuget.org (off = just build and attach them as artifacts)'
        type: boolean
        default: false

jobs:
  pack:
    # Windows is the only host that can produce ALL target frameworks in one package:
    # the iOS/Android workloads compile *libraries* here without a Mac (a Mac is only
    # needed to build, sign and run an app), while net*-windows cannot be built anywhere else.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads (android + ios + windows)
        run: dotnet workload install maui

      - name: Validate the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match Directory.Build.props ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Pack the inspector
        run: >
          dotnet pack src/Immons.Tools.Maui.Inspector/Immons.Tools.Maui.Inspector.csproj
          -c Release -o ./artifacts -p:GeneratePackageOnBuild=false

      - name: Pack the SQLite storage backend
        run: >
          dotnet pack src/Immons.Tools.Maui.Inspector.Persistency/Immons.Tools.Maui.Inspector.Persistency.csproj
          -c Release -o ./artifacts -p:GeneratePackageOnBuild=false

      - name: Pack the XAML Updater tool
        run: >
          dotnet pack src/Immons.Tools.Maui.Inspector.Sync/Immons.Tools.Maui.Inspector.Sync.csproj
          -c Release -o ./artifacts -p:GeneratePackageOnBuild=false

      - name: Pack the markup extensions (Adaptive)
        run: >
          dotnet pack src/Immons.Tools.Maui.Inspector.Extensions/Immons.Tools.Maui.Inspector.Extensions.csproj
          -c Release -o ./artifacts -p:GeneratePackageOnBuild=false

      - name: Verify the package carries every target framework
        shell: pwsh
        run: |
          # Only the main package — Persistency and Sync now share the same name prefix.
          $pkg = Get-ChildItem ./artifacts/Immons.Tools.Maui.Inspector.*.nupkg |
                 Where-Object { $_.Name -match '^Immons\.Tools\.Maui\.Inspector\.\d' } | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $tfms = $zip.Entries.FullName | Where-Object { $_ -like 'lib/*' } |
                  ForEach-Object { $_.Split('/')[1] } | Sort-Object -Unique
          $zip.Dispose()
          Write-Host "TFMs in $($pkg.Name): $($tfms -join ', ')"
          foreach ($expected in 'net10.0', 'android', 'ios', 'windows') {
            if (-not ($tfms | Where-Object { $_ -like "*$expected*" })) {
              Write-Error "Missing target framework: $expected"; exit 1
            }
          }
          "### Packed TFMs`n`n``$($tfms -join ', ')``" >> $env:GITHUB_STEP_SUMMARY
          $expectedPackages = @('Immons.Tools.Maui.Inspector', 'Immons.Tools.Maui.Inspector.Persistency', 'Immons.Tools.Maui.Inspector.Sync', 'Immons.Tools.Maui.Inspector.Extensions')
          foreach ($name in $expectedPackages) {
            if (-not (Get-ChildItem "./artifacts/$name.*.nupkg" -ErrorAction SilentlyContinue)) {
              Write-Error "Missing package: $name"; exit 1
            }
          }

      - name: Attach the packages to the run
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*

  # Only a tag — or a manual run that explicitly asks for it — reaches nuget.org.
  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
